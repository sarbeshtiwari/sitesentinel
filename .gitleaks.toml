# Secret scanning (CI: pinned gitleaks binary, see .github/workflows/ci.yml). Default rules apply everywhere; the allowlist covers ONLY test fixtures whose
# "secrets" are deliberate, non-functional test values (test passwords, test gateway signing secrets, fake tokens used
# to test log redaction) and the isolation test topology. Application source, infra/staging, docs and config stay
# fully scanned. Reviewed during release readiness (RELEASE_READINESS.md §11).
[extend]
useDefault = true

[allowlist]
description = "test fixtures and design canvases only"
paths = [
  '''^apps/[a-z-]+/test/''',
  '''^packages/[a-z-]+/test/''',
  '''^tests/e2e/''',
  '''^infra/security/isolation/docker-compose\.yml$''',
  # Pencil design canvases (design/*.pen): an encoded design format whose long strings match the generic high-entropy
  # key rule. They hold only placeholder UI text — never credentials. Exported design PNGs and everything else stay scanned.
  '''^design/[^/]+\.pen$''',
]
