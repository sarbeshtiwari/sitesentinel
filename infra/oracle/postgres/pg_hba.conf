# SiteSentinel production pg_hba (infra/oracle). TLS is mandatory for every network connection.
# TYPE    DATABASE  USER  ADDRESS          METHOD
# Unix socket inside the container only (docker exec: healthcheck, backups, restore). Not reachable from the network.
local     all       all                    trust
# The `data` Docker network (10.253.20.0/24): TLS + SCRAM only.
hostssl   all       all   10.253.20.0/24   scram-sha-256
# Everything else, and any non-TLS attempt, is refused.
host      all       all   0.0.0.0/0        reject
host      all       all   ::/0             reject
