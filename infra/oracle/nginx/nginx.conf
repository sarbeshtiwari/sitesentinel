# SiteSentinel edge (infra/oracle). nginxinc/nginx-unprivileged: runs as uid 101, listens on 8080/8443
# (published as 80/443), read-only root filesystem with tmpfs /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  types_hash_max_size 4096;
  server_names_hash_bucket_size 128;

  # ---- Real client IP (Cloudflare) -----------------------------------------------------------------------------
  # Only Cloudflare's published ranges may set the client address; the header is CF-Connecting-IP (one value, set by
  # Cloudflare, cannot be appended to by the client). Requests from anywhere else keep the TCP peer as $remote_addr.
  # The host firewall additionally only accepts 80/443 from these ranges (infra/oracle/firewall.sh).
  # Refresh with infra/oracle/update-cloudflare-ips.sh (weekly systemd timer) → /opt/sitesentinel/cloudflare-realip.conf.
  include /etc/nginx/cloudflare-realip.conf;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;

  # Docker's embedded DNS: upstream containers are re-resolved, so a restarted container (new IP) is found again.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  log_format main '$remote_addr - [$time_iso8601] "$request_method $host $uri $server_protocol" $status $body_bytes_sent '
                  '$request_time "$http_referer" "$http_user_agent" rid=$request_id cf_ray=$http_cf_ray';
  # Query strings are NOT logged (they may carry one-time tokens, e.g. artifact download links).
  access_log /dev/stdout main;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

  # Per-client-IP request limits (after realip, so per real visitor). Generous: the applications enforce the real
  # per-account / per-IP limits in Redis; these only blunt floods before they reach Node.
  limit_req_zone $binary_remote_addr zone=perip_app:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=perip_ingest:20m rate=60r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  include /etc/nginx/conf.d/*.conf;
}
