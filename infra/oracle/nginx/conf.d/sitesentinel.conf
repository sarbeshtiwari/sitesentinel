# SiteSentinel server blocks (infra/oracle). One origin certificate covers all four hostnames.
# Upstreams are addressed through variables so Docker DNS re-resolves them (see `resolver` in nginx.conf).
# The apex ziptat.in / www stay on Vercel and never reach this server.

# ---- Port 80: Cloudflare "Always Use HTTPS" normally answers first; anything that still arrives is redirected.
server {
  listen 8080 default_server;
  server_name _;
  location = /nginx-health { access_log off; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}

# ---- Unknown Host header on 443: close the connection (no default site, no host/IP probing).
server {
  listen 8443 ssl default_server;
  http2 on;
  server_name _;
  include /etc/nginx/snippets/tls.conf;
  return 444;
}

# ---- Customer web app: sentinel-client.ziptat.in → web:3000, /api/* → api:4000 (same origin: cookies + CSRF Origin).
server {
  listen 8443 ssl;
  http2 on;
  server_name sentinel-client.ziptat.in;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/security-headers.conf;
  client_max_body_size 1m;

  set $web http://web:3000;
  set $api http://api:4000;

  # The admin API is only served on the admin host (where the optional IP allowlist applies).
  location ^~ /api/admin/ { return 404; }
  location /api/ {
    limit_req zone=perip_app burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api;
  }
  location ^~ /_next/static/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $web;
    expires 365d;
  }
  location / {
    limit_req zone=perip_app burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $web;
  }
}

# ---- Super Admin app: sentinel-admin.ziptat.in → admin:3001, /api/admin/* → api:4000.
server {
  listen 8443 ssl;
  http2 on;
  server_name sentinel-admin.ziptat.in;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/admin-allowlist.conf;
  client_max_body_size 1m;

  set $admin http://admin:3001;
  set $api http://api:4000;

  location /api/admin/ {
    limit_req zone=perip_app burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api;
  }
  # The customer API is not part of the admin origin.
  location /api/ { return 404; }
  location ^~ /_next/static/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $admin;
    expires 365d;
  }
  location / {
    limit_req zone=perip_app burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $admin;
  }
}

# ---- API: sentinel-api.ziptat.in → api:4000. Health, payment-gateway webhooks (raw body preserved), screenshot
#      download links (API_URL) and the public settings endpoint. The browser apps call the API through their own
#      origin (/api on sentinel-client / sentinel-admin), so no CORS is needed or enabled here.
server {
  listen 8443 ssl;
  http2 on;
  server_name sentinel-api.ziptat.in;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/security-headers.conf;
  client_max_body_size 1m;

  set $api http://api:4000;

  location ^~ /api/admin/ { return 404; }
  location / {
    limit_req zone=perip_app burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_request_buffering on;
    proxy_pass $api;
  }
}

# ---- Ingest: sentinel-ingest.ziptat.in → ingest:4200. Called cross-origin from customer websites (the app sets
#      CORS headers itself). /sdk/monitor.v1.js is cacheable; /v1/collect bodies are capped at 64 KB by the app.
server {
  listen 8443 ssl;
  http2 on;
  server_name sentinel-ingest.ziptat.in;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/security-headers.conf;
  client_max_body_size 128k;

  set $ingest http://ingest:4200;

  location /sdk/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $ingest;
  }
  location / {
    limit_req zone=perip_ingest burst=120 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Cookie "";
    proxy_pass $ingest;
  }
}
