# Upstream request headers. X-Forwarded-For is OVERWRITTEN with the single real client address ($remote_addr after
# realip), never appended to: whatever a client sends in X-Forwarded-For / X-Real-IP / CF-Connecting-IP is discarded
# here, so the per-IP rate limits in the API and ingest cannot be bypassed by forging it (audit finding F-1).
# The apps trust exactly one proxy — this nginx at 10.253.10.2 (TRUST_PROXY=10.253.10.2) — and take the right-most
# (only) X-Forwarded-For value from it.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header CF-Connecting-IP  "";
proxy_set_header Forwarded         "";
proxy_set_header Connection        "";
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_buffering on;
proxy_buffers 16 16k;
proxy_buffer_size 16k;
