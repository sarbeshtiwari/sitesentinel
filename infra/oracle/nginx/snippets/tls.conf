# Cloudflare Origin Certificate (SSL/TLS → Origin Server → Create certificate; RSA or ECC, 15 years, hostnames
# *.ziptat.in + ziptat.in or the four sentinel-* names). Save on the server as:
#   /opt/sitesentinel/certs/origin.pem  (certificate, 644)   /opt/sitesentinel/certs/origin.key  (private key, 600)
# They are mounted read-only at /etc/nginx/certs. Only valid behind Cloudflare (SSL/TLS mode "Full (strict)").
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Optional — Authenticated Origin Pulls (Cloudflare → SSL/TLS → Origin Server → "Authenticated Origin Pulls" ON):
# nginx then only completes TLS for clients presenting Cloudflare's origin-pull certificate, so even a request that
# bypasses the firewall cannot reach the apps. Download the CA from
# https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem to
# /opt/sitesentinel/certs/cloudflare-origin-pull-ca.pem, uncomment both lines, then: docker compose … restart nginx
# ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
# ssl_verify_client on;
