# Browser runner — production runtime configuration (release readiness, blockers 1/2). Mirrors the run flags proven by
# infra/security/run-isolation-tests.sh with RUNNER_IMAGE=<this image>. IMAGE_DIGEST is the CI-built digest (never :latest).
apiVersion: apps/v1
kind: Deployment
metadata: { name: browser-runner, namespace: sitesentinel }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/component: browser-runner } }
  template:
    metadata:
      labels: { app.kubernetes.io/component: browser-runner }
      annotations:
        # the custom Chromium seccomp profile (infra/security/seccomp/chromium.json) installed on the nodes
        container.apparmor.security.beta.kubernetes.io/runner: runtime/default
    spec:
      automountServiceAccountToken: false     # no Kubernetes API credentials in the browser's pod
      enableServiceLinks: false               # no service discovery environment variables
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001                       # pwuser
        seccompProfile: { type: Localhost, localhostProfile: profiles/chromium.json }
      containers:
        - name: runner
          image: REGISTRY/wim-browser-runner@IMAGE_DIGEST
          env:
            - { name: RUNNER_GATEWAY_URL, value: "http://egress-gateway.sitesentinel.svc:8080" }
            - { name: RUNNER_BIND_HOST, value: "0.0.0.0" }
            - { name: RUNNER_ADVERTISE_HOST, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: RUNNER_MAX_SESSIONS, value: "2" }
            - { name: RUNNER_SANDBOX, value: "true" }
            # NO secrets, NO database/Redis/storage URLs. RUNNER_TEST_TRUST_SPKI must never be set (refused outside NODE_ENV=test).
          securityContext:
            allowPrivilegeEscalation: false   # no-new-privileges
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: "500m", memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
          readinessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 15, failureThreshold: 4 }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 256Mi } }
